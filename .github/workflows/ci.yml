name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test
      # Falha o build se houver vulnerabilidade ALTA/CRÍTICA em dependências de produção
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
        continue-on-error: true   # remova esta linha quando o lint estiver 100% limpo
      - run: npm run build
        env: { VITE_API_URL: https://api.exemplo.com/api }
      - run: npm audit --omit=dev --audit-level=high
